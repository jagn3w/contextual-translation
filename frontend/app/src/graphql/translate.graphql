mutation Translate($input: TranslateInput!) {
  translate(input: $input) {
    translation {
      text
      notes
      furigana
      glosses {
        text
        reading
        meaning
        startsAt
        length
      }
      glossesTruncated
      sourceLanguage
      targetLanguage
    }
    errors {
      code
      message
      retryable
      retryAfterSeconds
    }
  }
}
