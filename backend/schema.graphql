input CreateDiaryEntryInput {
  language: Language!
  notesLanguage: Language!
}

input DeleteDiaryEntryInput {
  id: ID!
}

type DeleteDiaryEntryPayload {
  """
  The deleted entry's public id.
  """
  deletedId: ID
}

"""
Who wrote a diary comment.
"""
enum DiaryAuthor {
  """
  The person writing the diary.
  """
  LEARNER

  """
  Claude, as the tutor.
  """
  TUTOR
}

type DiaryComment {
  author: DiaryAuthor!
  body: String!
  createdAt: ISO8601DateTime!

  """
  A random UUID; internal ids are never exposed.
  """
  id: ID!
}

"""
One diary entry, private to the access code that wrote it.
"""
type DiaryEntry {
  body: String!
  createdAt: ISO8601DateTime!

  """
  A random UUID; internal ids are never exposed.
  """
  id: ID!

  """
  The language the entry is written in.
  """
  language: Language!

  """
  The learner's own language: feedback, tips, hints and replies are written in it.
  """
  notesLanguage: Language!

  """
  The first ~12 words of `body` (~40 characters for Japanese), with "…" when cut. Empty when the body is.
  """
  preview: String!
  reviewedAt: ISO8601DateTime

  """
  The body as it was last reviewed; thread spans point into it. Null until the first review.
  """
  reviewedBody: String

  """
  In creation order.
  """
  threads: [DiaryThread!]!
  updatedAt: ISO8601DateTime!
}

type DiaryEntryPayload {
  """
  Null when errors is non-empty.
  """
  entry: DiaryEntry
  errors: [TranslateError!]!
}

"""
A tutor thread on a diary entry: a sentence's verdict, an entry-wide note, or a "Help me say…" question.
"""
type DiaryThread {
  """
  Oldest first.
  """
  comments: [DiaryComment!]!
  createdAt: ISO8601DateTime!

  """
  False for SENTENCE threads superseded by a later review.
  """
  current: Boolean!

  """
  HELP: how many general hints have been given.
  """
  hintLevel: Int!

  """
  A random UUID; internal ids are never exposed.
  """
  id: ID!
  kind: DiaryThreadKind!

  """
  The sentence's length in Unicode code points, with `startsAt`.
  """
  length: Int
  resolved: Boolean!

  """
  SENTENCE: the sentence as reviewed. HELP: the question.
  """
  sentence: String

  """
  SENTENCE: where the sentence starts in `reviewedBody`, in Unicode code points. Null when it could not be located.
  """
  startsAt: Int

  """
  ENTRY only.
  """
  title: String

  """
  SENTENCE only.
  """
  verdict: DiaryVerdict
}

"""
What a diary thread is about.
"""
enum DiaryThreadKind {
  """
  An entry-wide note from a review.
  """
  ENTRY

  """
  A "Help me say…" question and its hints.
  """
  HELP

  """
  The tutor's verdict on one sentence of a review.
  """
  SENTENCE
}

type DiaryThreadPayload {
  errors: [TranslateError!]!

  """
  Null when errors is non-empty.
  """
  thread: DiaryThread
}

"""
An idea to write about.
"""
type DiaryTopic {
  """
  Its meaning, in the notes language.
  """
  gloss: String!

  """
  The prompt, in the entry's language.
  """
  prompt: String!
}

type DiaryTopicsPayload {
  errors: [TranslateError!]!

  """
  Empty when errors is non-empty.
  """
  topics: [DiaryTopic!]!
}

"""
The tutor's verdict on one sentence of a diary entry.
"""
enum DiaryVerdict {
  """
  Right, and reads naturally.
  """
  CORRECT

  """
  Understandable but unnatural or not quite the right word.
  """
  IMPROVABLE

  """
  Has a mistake of grammar, vocabulary, spelling or meaning.
  """
  WRONG
}

"""
A word of the translation with a short definition, for the UI to show on hover (design D2.3).
"""
type Gloss {
  """
  The word's length in Unicode code points.
  """
  length: Int!

  """
  A short definition, written in the source text's language — the language the notes use.
  """
  meaning: String!

  """
  For Japanese, the word's kana reading. Null when there is none.
  """
  reading: String

  """
  Where the word starts in `Translation.text`, counted in Unicode code points.
  """
  startsAt: Int!

  """
  The word exactly as it appears in the translation.
  """
  text: String!
}

"""
How much of a translation to gloss with per-word definitions (design D2.3).
"""
enum GlossLevel {
  """
  Every content word and set phrase, skipping function words.
  """
  EVERY

  """
  No glosses at all.
  """
  NONE

  """
  Only the words worth remarking on: ambiguous, idiomatic or register-carrying ones.
  """
  NOTABLE
}

"""
An ISO 8601-encoded datetime
"""
scalar ISO8601DateTime @specifiedBy(url: "https://tools.ietf.org/html/rfc3339")

"""
A supported language.
"""
enum Language {
  """
  English
  """
  EN

  """
  Spanish
  """
  ES

  """
  Japanese
  """
  JA
}

type Mutation {
  createDiaryEntry(input: CreateDiaryEntryInput!): DiaryEntryPayload!
  deleteDiaryEntry(input: DeleteDiaryEntryInput!): DeleteDiaryEntryPayload!
  replyToDiaryThread(input: ReplyToDiaryThreadInput!): DiaryThreadPayload!
  requestDiaryHint(input: RequestDiaryHintInput!): DiaryThreadPayload!
  resolveDiaryThread(input: ResolveDiaryThreadInput!): DiaryThreadPayload!
  reviewDiaryEntry(input: ReviewDiaryEntryInput!): DiaryEntryPayload!
  startDiaryHelpThread(input: StartDiaryHelpThreadInput!): DiaryThreadPayload!
  suggestDiaryTopics(input: SuggestDiaryTopicsInput!): DiaryTopicsPayload!
  translate(input: TranslateInput!): TranslatePayload!
  updateDiaryEntry(input: UpdateDiaryEntryInput!): DiaryEntryPayload!
}

type Query {
  """
  This access code's diary entries, newest first.
  """
  diaryEntries: [DiaryEntry!]!

  """
  Null when missing or not this access code's.
  """
  diaryEntry(id: ID!): DiaryEntry

  """
  The signed-in session.
  """
  viewer: Viewer!
}

input ReplyToDiaryThreadInput {
  body: String!
  threadId: ID!
}

input RequestDiaryHintInput {
  """
  A HELP thread.
  """
  threadId: ID!
}

input ResolveDiaryThreadInput {
  resolved: Boolean!
  threadId: ID!
}

input ReviewDiaryEntryInput {
  body: String!
  id: ID!
}

input StartDiaryHelpThreadInput {
  entryId: ID!

  """
  What the learner wants to say, in their own language.
  """
  question: String!
}

input SuggestDiaryTopicsInput {
  """
  What the learner has written so far, saved or not. When it has text, the ideas
  are follow-ups that build on it rather than fresh topics.
  """
  body: String
  language: Language!
  notesLanguage: Language!
}

"""
An anticipated translation failure (design D3.3).
"""
type TranslateError {
  code: TranslateErrorCode!

  """
  Safe, user-facing English text.
  """
  message: String!

  """
  Seconds to wait before retrying, when known.
  """
  retryAfterSeconds: Int

  """
  Whether trying again may succeed.
  """
  retryable: Boolean!
}

"""
Why a translation failed. Each code has its own user-facing message (design D3.3).
"""
enum TranslateErrorCode {
  """
  The demo's Claude usage budget is used up.
  """
  BUDGET_EXCEEDED

  """
  The source text is blank.
  """
  EMPTY_INPUT

  """
  The source text or context is over its length limit.
  """
  INPUT_TOO_LONG

  """
  The translation was too long to finish.
  """
  OUTPUT_TOO_LONG

  """
  This session or access code is translating too quickly.
  """
  RATE_LIMITED

  """
  Claude declined to translate the text.
  """
  REFUSED

  """
  The source and target languages are the same.
  """
  SAME_LANGUAGE

  """
  The server's Claude credentials or settings are wrong.
  """
  SERVICE_MISCONFIGURED

  """
  Claude took too long to respond.
  """
  TIMEOUT

  """
  Claude returned a server error.
  """
  UPSTREAM_ERROR

  """
  Claude is temporarily overloaded.
  """
  UPSTREAM_OVERLOADED

  """
  Claude is rate-limiting requests.
  """
  UPSTREAM_RATE_LIMITED

  """
  Claude could not be reached.
  """
  UPSTREAM_UNREACHABLE
}

input TranslateInput {
  """
  The situation: where you are, who is speaking to whom, the desired formality or region.
  """
  context: String

  """
  How much of the translation to gloss with per-word definitions.
  """
  glossLevel: GlossLevel = NOTABLE
  sourceLanguage: Language!
  sourceText: String!
  targetLanguage: Language!
}

type TranslatePayload {
  errors: [TranslateError!]!

  """
  Null when errors is non-empty.
  """
  translation: Translation
}

type Translation {
  """
  For Japanese, `text` repeated with a reading in double angle brackets after
  each run of kanji (漢字《かんじ》); removing every 《…》 group gives back `text`. Every
  run of kanji in `text` carries exactly one group and no group sits anywhere
  else, so the run a reading follows is the run it was written for. Null when
  there is none, which `readingsOmitted` explains for a Japanese target.
  """
  furigana: String

  """
  Words of `text` worth defining, in the order they appear in it, with
  non-overlapping spans. Empty when there is nothing to gloss.
  """
  glosses: [Gloss!]!

  """
  True when more glosses were offered than the cap allows and the extras were
  dropped, so `glosses` runs out before the end of `text`. False means only that
  the cap did not cut the list off: `glosses` is never a complete index of
  `text`, and a word without one is ordinary.
  """
  glossesTruncated: Boolean!

  """
  Claude's note on the meaning, formality and regional variety it chose.
  """
  notes: String

  """
  True whenever the target is Japanese and `furigana` is null, whatever the
  reason: the source was too long for readings to be asked for, `text` has no
  kanji to annotate, or the readings that came back did not annotate `text` and
  were dropped. So `text` is Japanese and carries no readings, which is worth
  saying to a reader expecting them. False for every target but Japanese, where
  readings are not expected in the first place.
  """
  readingsOmitted: Boolean!
  sourceLanguage: Language!
  targetLanguage: Language!
  text: String!
}

input UpdateDiaryEntryInput {
  body: String
  id: ID!

  """
  Only while the entry has never been reviewed.
  """
  language: Language

  """
  Only while the entry has never been reviewed.
  """
  notesLanguage: Language
}

"""
The signed-in session.
"""
type Viewer {
  accessCodeExpiresAt: ISO8601DateTime
  accessCodeLabel: String!
  sessionExpiresAt: ISO8601DateTime!
}
