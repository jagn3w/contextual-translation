default: &default
  store_options:
    # Cap age of oldest cache entry to fulfill retention policies
    # max_age: <%= 60.days.to_i %>
    max_size: <%= 256.megabytes %>
    namespace: <%= Rails.env %>

development:
  <<: *default

test:
  <<: *default

production:
  # Shares the primary database (design D5.3); the solid_cache_entries table comes from the
  # CreateSolidCacheEntries migration in the primary schema.
  <<: *default
